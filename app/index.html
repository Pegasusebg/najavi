<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eff7f1">
  <title>Najavi</title>
  <meta name="application-name" content="Najavi">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Najavi">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/najava-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/najava-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root{
  --bg:#f6faf6;
  --bg-soft:#fbfdfb;
  --surface:#ffffff;
  --surface-2:#f7fbf7;
  --ink:#17251c;
  --muted:#708174;
  --muted-2:#8ea092;
  --line:#dce9dd;
  --line-2:#ecf3ed;
  --green-1:#d8f1dc;
  --green-2:#bde7c5;
  --green-3:#93d0a0;
  --green-4:#61b978;
  --green-5:#3d9d5a;
  --green-6:#2f7e49;
  --safe:#2f7e49;
  --safe-bg:#ebf8ee;
  --warn:#b47a17;
  --warn-bg:#fff5df;
  --water:#4b79c7;
  --water-bg:#eef4ff;
  --electric:#b47a17;
  --electric-bg:#fff5df;
  --shadow-xs:0 2px 8px rgba(46,76,55,.04);
  --shadow-sm:0 8px 26px rgba(46,76,55,.07);
  --shadow-lg:0 18px 48px rgba(46,76,55,.10);
  --radius-lg:24px;
  --radius:18px;
  --radius-md:14px;
  --radius-sm:12px;
}
*{box-sizing:border-box}
html{background:var(--bg);font-family:'Poppins',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body{margin:0;min-height:100vh;background:
  radial-gradient(circle at 0% 0%, rgba(188,231,197,.48) 0, rgba(188,231,197,0) 26%),
  linear-gradient(180deg,#fbfdfb 0,var(--bg) 220px)}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}
button{cursor:pointer}
input,select{outline:none}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:rgba(255,255,255,.72);backdrop-filter:blur(12px);border-right:1px solid var(--line);padding:22px 16px 18px;display:flex;flex-direction:column;gap:22px}
.logo{display:flex;align-items:flex-start;gap:14px;padding:4px 8px 2px}
.logo-badge{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--green-4),var(--green-6));display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px rgba(72,146,87,.22)}
.logo-badge svg{width:26px;height:26px}
.logo-title{font-size:18px;font-weight:800;letter-spacing:-.02em}
.logo-sub{font-size:12px;line-height:1.45;color:var(--muted);margin-top:3px;max-width:120px}
.nav{display:grid;gap:8px}
.nav-btn{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;color:#506252;font-weight:600;font-size:15px;transition:.16s ease}
.nav-btn svg{width:22px;height:22px;stroke-width:2}
.nav-btn.active{background:linear-gradient(90deg,#edf8ef 0,#f7fbf7 100%);color:#25673c;box-shadow:inset 4px 0 0 var(--green-5)}
.nav-btn:hover{background:#f7fbf7}
.sidebar-card{margin-top:auto;background:linear-gradient(180deg,#ffffff 0,#f8fbf8 100%);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow-xs)}
.sidebar-card .side-icon{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#ecf8ee,#f7fbf8);border:1px solid var(--line);display:grid;place-items:center;color:var(--green-6);margin-bottom:14px}
.sidebar-card h4{margin:0 0 8px;font-size:14px;line-height:1.35;letter-spacing:-.02em}
.sidebar-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.content{padding:0 28px 28px}
.topbar{height:86px;display:flex;align-items:center;justify-content:flex-end;gap:16px;border-bottom:1px solid var(--line);margin:0 -28px 0;padding:0 28px;background:rgba(246,250,246,.72);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.live-pill{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#f2fbf3;border:1px solid #d7ebda;color:var(--green-6);font-size:14px;font-weight:700}
.live-dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--green-4),var(--green-6));box-shadow:0 0 0 5px rgba(97,185,120,.12)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#eef3ef;color:#536356;font-weight:700}
.page{max-width:1240px;margin:0 auto;padding:28px 0 0}
.eyebrow{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;background:#eff9f1;border:1px solid #dcefe0;color:var(--green-6);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.hero{margin-top:18px}
.hero h1{margin:0;font-size:52px;line-height:1.02;letter-spacing:-.05em;font-weight:800}
.hero p{margin:10px 0 0;color:var(--muted);font-size:16px}
.toolbar{margin-top:26px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.toolbar .meta strong{display:block;font-size:18px;letter-spacing:-.02em}
.toolbar .meta span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.tool-row{display:flex;gap:12px;flex-wrap:wrap}
.tool-chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:10px;font-weight:600;color:#3d4e40;box-shadow:var(--shadow-xs)}
.tool-chip.active{background:linear-gradient(180deg,#edf8ef,#ffffff);border-color:#d3e6d7;color:var(--green-6)}
.tool-chip svg{width:22px;height:22px}
.dashboard{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(340px,.85fr);gap:22px;margin-top:18px}
.stack{display:grid;gap:20px}
.card{background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow-sm)}
.card-pad{padding:22px}
.alert-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;border-color:#ebddb8;background:linear-gradient(135deg,#fffcf5 0,#ffffff 100%);padding:20px 22px}
.alert-icon{width:68px;height:68px;border-radius:20px;background:linear-gradient(180deg,#fff7e8,#fffdf8);display:grid;place-items:center;color:var(--electric);border:1px solid #f4e7c9}
.alert-icon svg{width:30px;height:30px}
.alert-title{font-size:20px;font-weight:800;letter-spacing:-.02em}
.alert-meta{margin-top:6px;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.alert-meta span{display:flex;align-items:center;gap:8px}
.btn-primary{border:0;padding:16px 24px;border-radius:20px;background:linear-gradient(135deg,var(--green-4),var(--green-6));color:#fff;font-weight:700;font-size:16px;box-shadow:0 10px 22px rgba(74,142,88,.22)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}
.card-head h3{margin:0;font-size:20px;line-height:1.15;letter-spacing:-.03em}
.card-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.btn-secondary{border:1px solid var(--line);background:#fff;padding:13px 16px;border-radius:18px;font-weight:600;color:#39503d;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-xs)}
.detail-shell{border:1px solid var(--line);background:#fff;border-radius:22px;padding:22px}
.detail-header{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:flex-start}
.detail-icon{width:66px;height:66px;border-radius:20px;background:linear-gradient(180deg,#ecf8ee,#f7fbf8);display:grid;place-items:center;color:var(--green-6);border:1px solid var(--line)}
.detail-icon.warn{background:linear-gradient(180deg,#fff8eb,#fffdf8);color:var(--electric);border-color:#f4e7c9}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700}
.badge.electric{background:var(--electric-bg);color:var(--electric)}
.badge.blue{background:#eef6ff;color:#3e73b7}
.badge.green{background:var(--safe-bg);color:var(--safe)}
.detail-title{font-size:20px;font-weight:800;letter-spacing:-.03em;margin:0 0 10px}
.rows{display:grid;gap:12px;margin-top:10px}
.row{display:flex;align-items:flex-start;gap:12px;color:#536355;font-size:15px;line-height:1.5}
.row svg{flex:0 0 auto;color:#738477}
.duration{border-top:1px solid var(--line-2);margin-top:12px;padding-top:14px;font-size:16px;font-weight:700;color:#36473a}
.tip{margin-top:16px;border-radius:16px;background:#f7faf8;padding:14px 16px;display:flex;gap:12px;color:#617264;font-size:14px;line-height:1.55}
.tip svg{color:var(--electric);flex:0 0 auto}
.link-cta{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:14px;font-weight:700;color:var(--green-6)}
.aside-card{padding:22px}
.address-row{border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:#fff}
.home-icon{width:72px;height:72px;border-radius:22px;background:linear-gradient(180deg,#eef8ef,#f8fbf8);display:grid;place-items:center;color:var(--green-6);border:1px solid var(--line)}
.address-name{font-size:18px;font-weight:800;letter-spacing:-.025em}
.address-sub{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-top:4px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700}
.chip.electric{background:var(--electric-bg);color:var(--electric)}
.chip.water{background:var(--water-bg);color:var(--water)}
.icon-btn{width:48px;height:48px;border:1px solid var(--line);background:#fff;border-radius:16px;display:grid;place-items:center;color:#516253;box-shadow:var(--shadow-xs)}
.source-strip{margin-top:18px;border-radius:20px;border:1px solid #d9eadb;background:linear-gradient(180deg,#f2fbf3,#f8fcf8);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px;color:#536355}
.source-strip .left,.source-strip .right{display:flex;align-items:center;gap:12px}
.source-strip strong{font-size:15px}
.source-strip .right{font-weight:700;color:#39503d}
.source-strip .status-dot{width:10px;height:10px;border-radius:50%;background:var(--green-5)}
.mobile-bottom{display:none}
.empty{padding:28px 22px;color:var(--muted);text-align:center}
.icon{width:22px;height:22px;display:inline-block;vertical-align:middle}
.icon.sm{width:18px;height:18px}
.icon.xs{width:16px;height:16px}
svg{stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:1100px){
  .dashboard{grid-template-columns:1fr}
  .content{padding:0 18px 24px}
  .topbar{margin:0 -18px;padding:0 18px}
}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
  .topbar{height:72px}
  .hero h1{font-size:34px}
  .toolbar{margin-top:20px}
  .tool-row{display:none}
  .alert-card{grid-template-columns:1fr;align-items:flex-start}
  .btn-primary{width:100%}
  .address-row{grid-template-columns:auto 1fr}
  .icon-btn{justify-self:end}
  .mobile-bottom{display:grid;position:fixed;left:12px;right:12px;bottom:12px;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:var(--shadow-lg)}
  .mobile-bottom .nav-btn{padding:10px 4px;border-radius:16px;display:grid;gap:5px;justify-items:center;font-size:11px}
  .mobile-bottom .nav-btn.active{background:#eff9f1;box-shadow:none}
  .page{padding-bottom:88px}
}
@media (max-width:560px){
  .content{padding:0 14px 20px}
  .topbar{margin:0 -14px;padding:0 14px}
  .page{padding-top:18px}
  .hero h1{font-size:30px}
  .hero p{font-size:14px}
  .eyebrow{font-size:11px;padding:7px 10px}
  .toolbar .meta strong{font-size:16px}
  .alert-title{font-size:18px}
  .alert-meta{font-size:13px;gap:12px}
  .card-pad,.aside-card,.detail-shell{padding:18px}
  .detail-title{font-size:18px}
  .home-icon,.detail-icon,.alert-icon{width:58px;height:58px;border-radius:18px}
  .source-strip{padding:16px;flex-direction:column;align-items:flex-start}
}


/* ===== Compact focus pass ===== */
.layout{grid-template-columns:238px 1fr}
.sidebar{padding:18px 14px 16px;gap:18px}
.logo{gap:12px;padding:2px 6px}
.logo-badge{width:46px;height:46px;border-radius:15px}
.logo-badge svg{width:22px;height:22px}
.logo-title{font-size:16px}
.logo-sub{font-size:10px;line-height:1.4;max-width:110px}
.nav{gap:5px}
.nav-btn{gap:12px;padding:11px 13px;border-radius:13px;font-size:13px}
.nav-btn svg{width:19px;height:19px}
.sidebar-card{padding:13px;border-radius:17px}
.sidebar-card .side-icon{width:38px;height:38px;border-radius:12px;margin-bottom:10px}
.sidebar-card h4{font-size:12px;margin-bottom:5px}
.sidebar-card p{font-size:10px;line-height:1.5}

.content{padding:0 24px 24px}
.topbar{height:68px;margin:0 -24px;padding:0 24px;gap:10px}
.live-pill{padding:8px 12px;font-size:11px}
.live-dot{width:8px;height:8px}
.avatar{width:36px;height:36px;font-size:12px}
.topbar .icon-btn{width:36px!important;height:36px!important}

.page{max-width:1180px;padding-top:22px}
.eyebrow{padding:6px 9px;font-size:10px}
.hero{margin-top:12px}
.hero h1{font-size:38px;line-height:1.06;letter-spacing:-.04em}
.hero p{margin-top:6px;font-size:13px}
.toolbar{margin-top:18px}
.toolbar .meta strong{font-size:15px}
.toolbar .meta span{font-size:11px}
.tool-row{display:none!important}

.dashboard{gap:16px;margin-top:14px;grid-template-columns:minmax(0,1.7fr) minmax(310px,.78fr)}
.stack{gap:14px}
.card{border-radius:20px}
.card-pad{padding:17px}
.alert-card{gap:14px;padding:15px 17px}
.alert-icon{width:52px;height:52px;border-radius:16px}
.alert-icon svg{width:23px;height:23px}
.alert-title{font-size:16px}
.alert-meta{margin-top:4px;font-size:11px;gap:12px}
.alert-meta .icon.sm{width:15px;height:15px}
.btn-primary{padding:11px 17px;border-radius:15px;font-size:12px}
.card-head{margin-bottom:13px}
.card-head h3{font-size:16px}
.card-head p{margin-top:3px;font-size:11px}
.btn-secondary{padding:9px 12px;border-radius:14px;font-size:11px}
.detail-shell{padding:16px;border-radius:18px}
.detail-header{gap:13px}
.detail-icon{width:50px;height:50px;border-radius:16px}
.badges{gap:6px;margin-bottom:7px}
.badge{gap:5px;padding:5px 8px;font-size:9px}
.detail-title{font-size:16px;margin-bottom:7px}
.rows{gap:8px;margin-top:7px}
.row{gap:8px;font-size:11px;line-height:1.45}
.duration{margin-top:9px;padding-top:10px;font-size:12px}
.tip{margin-top:11px;padding:10px 12px;border-radius:13px;font-size:10px;line-height:1.5}
.link-cta{margin-top:12px;font-size:11px}

.aside-card{padding:17px}
.address-row{padding:13px;border-radius:17px;gap:12px}
.home-icon{width:52px;height:52px;border-radius:16px}
.address-name{font-size:14px}
.address-sub{gap:6px;font-size:10px;margin-top:3px}
.chips{gap:6px;margin-top:9px}
.chip{gap:4px;padding:5px 8px;font-size:9px}
.icon-btn{width:38px;height:38px;border-radius:13px}
.source-strip{margin-top:14px;padding:13px 15px;border-radius:16px}
.source-strip strong{font-size:11px}
.source-strip .left>svg{width:18px;height:18px}
.source-strip .right{font-size:11px}

.empty{padding:22px 16px;font-size:12px}
.icon{width:19px;height:19px}
.icon.sm{width:15px;height:15px}
.icon.xs{width:13px;height:13px}

/* Real viewport modal */
.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:1000;
  display:grid;
  place-items:center;
  padding:24px;
  background:rgba(19,36,24,.34);
  backdrop-filter:blur(7px);
  overflow:auto;
}
.modal-card{
  width:min(520px,calc(100vw - 32px));
  max-height:calc(100vh - 48px);
  overflow:auto;
  padding:20px;
  border-radius:22px;
  box-shadow:0 24px 70px rgba(33,62,40,.20);
}
.modal-card .card-head{position:sticky;top:-20px;z-index:2;background:#fff;padding:4px 0 10px}
.modal-card label{font-size:11px!important}
.modal-card input,.modal-card select{padding:11px 13px!important;border-radius:12px!important;font-size:12px!important}
.modal-card form>div{gap:11px!important}

@media(max-width:1100px){
  .content{padding:0 18px 22px}
  .topbar{margin:0 -18px;padding:0 18px}
}
@media(max-width:860px){
  .hero h1{font-size:30px}
  .page{padding-top:16px}
  .dashboard{grid-template-columns:1fr}
}
@media(max-width:560px){
  .content{padding:0 12px 18px}
  .topbar{margin:0 -12px;padding:0 12px}
  .hero h1{font-size:27px}
  .hero p{font-size:12px}
  .alert-card{grid-template-columns:auto 1fr}
  .alert-card .btn-primary{grid-column:1/-1;width:100%}
  .detail-header{grid-template-columns:1fr}
  .detail-icon{width:44px;height:44px}
  .address-row{grid-template-columns:auto 1fr auto}
  .modal-backdrop{padding:12px}
  .modal-card{width:min(100%,480px);max-height:calc(100vh - 24px);padding:16px;border-radius:18px}
  .modal-card .card-head{top:-16px}
}


/* ===== Auth, preferences, install & polished modal ===== */
.auth-page{min-height:100vh;display:grid;grid-template-columns:minmax(360px,.92fr) minmax(520px,1.08fr);background:
 radial-gradient(circle at 10% 0%,rgba(189,231,197,.54),transparent 32%),linear-gradient(180deg,#fbfdfb,#f3f8f4)}
.auth-brand{padding:46px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line)}
.auth-brand-top{display:flex;align-items:center;gap:14px}
.auth-brand-mark{width:58px;height:58px;border-radius:19px;background:linear-gradient(135deg,var(--green-4),var(--green-6));display:grid;place-items:center;color:#fff;box-shadow:0 12px 30px rgba(72,146,87,.22)}
.auth-brand-mark svg{width:27px;height:27px}
.auth-brand h1{font-size:42px;line-height:1.05;letter-spacing:-.05em;margin:28px 0 12px;max-width:520px}
.auth-brand p{color:var(--muted);font-size:14px;line-height:1.65;max-width:500px}
.auth-benefits{display:grid;gap:10px;margin-top:26px}
.auth-benefit{display:flex;align-items:center;gap:10px;color:#4c6150;font-size:12px}
.auth-benefit svg{color:var(--green-6)}
.auth-panel-wrap{display:grid;place-items:center;padding:34px}
.auth-card{width:min(430px,100%);padding:24px;border-radius:24px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.auth-card h2{margin:0;font-size:23px;letter-spacing:-.035em}
.auth-card>p{margin:6px 0 20px;color:var(--muted);font-size:12px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#f4f8f4;border-radius:13px;margin-bottom:18px}
.auth-tab{border:0;background:transparent;border-radius:10px;padding:9px;font-size:11px;font-weight:700;color:#748477}
.auth-tab.active{background:#fff;color:var(--green-6);box-shadow:var(--shadow-xs)}
.form-field{display:grid;gap:6px;margin-bottom:12px}
.form-field label{font-size:10px;font-weight:700;color:#4a5c4e}
.form-field input,.form-field select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--ink)}
.form-field input:focus,.form-field select:focus{border-color:#9fd0aa;box-shadow:0 0 0 3px rgba(97,185,120,.10)}
.auth-error{padding:9px 11px;border-radius:11px;background:#fff2f0;color:#a5483e;font-size:10px;margin-bottom:12px}
.auth-success{padding:10px 11px;border-radius:11px;background:#eef9f1;color:#2f7544;border:1px solid #d3ead8;font-size:10px;line-height:1.5;margin-bottom:12px}
.auth-link-row{display:flex;justify-content:flex-end;margin:-3px 0 13px}
.auth-link{border:0;background:transparent;padding:0;color:var(--green-6);font-size:10px;font-weight:700;cursor:pointer}
.auth-link:hover{text-decoration:underline}
.auth-back{display:inline-flex;margin-top:14px;border:0;background:transparent;padding:0;color:#607164;font-size:10px;font-weight:600;cursor:pointer}
.auth-back:hover{color:var(--green-6)}
.auth-foot{margin-top:13px;color:var(--muted);font-size:9px;line-height:1.5}
.activation-card{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:15px;border-radius:18px;background:linear-gradient(135deg,#dff3e4,#fbfdfb);border:1px solid #bcdcc3;box-shadow:var(--shadow-xs);margin-bottom:12px}
.activation-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#fff;border:1px solid #cbe2d0;color:var(--green-6)}
.activation-copy strong{display:block;font-size:12px}.activation-copy span{display:block;margin-top:3px;color:#617365;font-size:10px;line-height:1.45}
.activation-btn{border:1px solid #3b8a52;background:linear-gradient(135deg,var(--green-4),var(--green-6));color:#fff;padding:10px 12px;border-radius:12px;font-size:10px;font-weight:700;white-space:nowrap}
.install-onboarding-backdrop{position:fixed;inset:0;z-index:120;background:rgba(19,33,23,.46);backdrop-filter:blur(7px);display:grid;place-items:center;padding:18px}
.install-onboarding-card{width:min(520px,100%);max-height:88dvh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 24px 70px rgba(21,45,28,.24)}
.install-onboarding-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:18px}
.install-onboarding-head h3{margin:0;font-size:20px;letter-spacing:-.035em}.install-onboarding-head p{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.5}
.install-close{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:#637466}
.install-guide{display:grid;gap:10px}.install-guide-card{border:1px solid var(--line);background:#fafdfa;border-radius:16px;padding:14px}
.install-guide-card h4{margin:0 0 8px;font-size:12px}.install-guide-card ol{margin:0;padding-left:19px;color:#596b5c;font-size:10px;line-height:1.8}
.install-onboarding-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.install-onboarding-actions .btn-primary,.install-onboarding-actions .btn-secondary{flex:1;justify-content:center;min-width:140px}
.loading-screen{min-height:100vh;display:grid;place-items:center;color:var(--muted);font-size:13px}
.spinner{width:34px;height:34px;border:3px solid #dcebdd;border-top-color:var(--green-5);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

.profile-wrap{position:relative}
.profile-menu{position:absolute;right:0;top:48px;width:220px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);z-index:50}
.profile-email{padding:8px 9px 10px;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px solid var(--line-2);margin-bottom:5px}
.profile-action{width:100%;border:0;background:transparent;padding:9px;border-radius:10px;text-align:left;font-size:11px;font-weight:600;color:#435647}
.profile-action:hover{background:#f4f8f4}

.pref-list{display:grid;gap:8px}
.pref-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:#fff;cursor:pointer}
.pref-row:hover{background:#fbfdfb}
.pref-copy strong{display:block;font-size:12px}
.pref-copy span{display:block;color:var(--muted);font-size:10px;margin-top:3px;line-height:1.45}
.pref-check{position:absolute;opacity:0;pointer-events:none}
.toggle-ui{position:relative;width:42px;height:24px;border-radius:999px;background:#dfe8e0;transition:.16s}
.toggle-ui:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(23,37,28,.18);transition:.16s}
.pref-check:checked+.toggle-ui{background:linear-gradient(135deg,var(--green-4),var(--green-6))}
.pref-check:checked+.toggle-ui:after{transform:translateX(18px)}
.settings-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:16px}
.settings-card{padding:17px}
.install-box,.push-box{border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px}
.install-box h4,.push-box h4{margin:0 0 5px;font-size:13px}
.install-box p,.push-box p{margin:0;color:var(--muted);font-size:10px;line-height:1.55}
.install-steps{margin:11px 0 0;padding-left:18px;color:#526555;font-size:10px;line-height:1.7}
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn-compact{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-size:10px;font-weight:700;color:#3d5141}
.btn-compact.primary{border:0;background:linear-gradient(135deg,var(--green-4),var(--green-6));color:#fff}
.push-state{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 8px;border-radius:999px;background:#f1f7f2;color:#58705d;font-size:9px;font-weight:700}
.push-state.on{background:#eaf8ed;color:var(--green-6)}
.detail-hidden{display:none}
.detail-expanded{display:block}
.summary-clickable{cursor:pointer}
.summary-clickable:hover{box-shadow:0 10px 28px rgba(46,76,55,.09)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:2000;background:#193120;color:#fff;padding:10px 14px;border-radius:12px;font-size:10px;box-shadow:var(--shadow-lg)}

.modal-card{background:#fff!important}
.modal-card .card-head h3{font-size:15px}
.modal-card .card-head p{font-size:10px}
.modal-card form>div>div{min-width:0}
.modal-card .btn-primary{width:100%;font-size:11px;padding:11px 14px}
.modal-card .btn-secondary{font-size:10px}
.modal-card input[type="checkbox"]{accent-color:var(--green-5)}
.service-choice{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0}
.service-choice label{display:flex!important;align-items:center;gap:7px;padding:9px 11px!important;border-radius:12px!important;background:#f8fbf8!important;border:1px solid var(--line)!important;font-size:10px!important}

@media(max-width:900px){
 .auth-page{grid-template-columns:1fr}
 .auth-brand{display:none}
 .auth-panel-wrap{padding:18px;min-height:100vh}
 .settings-grid{grid-template-columns:1fr}
}

function svg(inner, cls='icon'){ return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`; }
function icon(name, cls='icon'){ return icons[name] ? icons[name]().replace('class="icon"', `class="${cls}"`) : ''; }
const CYR={'а':'a','б':'b','в':'v','г':'g','д':'d','ђ':'dj','е':'e','ж':'z','з':'z','и':'i','ј':'j','к':'k','л':'l','љ':'lj','м':'m','н':'n','њ':'nj','о':'o','п':'p','р':'r','с':'s','т':'t','ћ':'c','у':'u','ф':'f','х':'h','ц':'c','ч':'c','џ':'dz','ш':'s'};
function translit(s=''){return String(s).toLowerCase().split('').map(ch=>CYR[ch]||ch).join('')}
function houseNum(v){const m=String(v||'').match(/\d+/);return m?Number(m[0]):null}
function norm(s=''){return translit(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function normStreet(s=''){
  let x=norm(s).replace(/^ulica\s+/,'').replace(/\s+ulica$/,'').trim();
  const p=x.split(' '); let w=p[p.length-1]||'';
  if(/skoj$/.test(w))w=w.replace(/skoj$/,'ska');
  else if(/evoj$/.test(w))w=w.replace(/evoj$/,'eva');
  else if(/ovoj$/.test(w))w=w.replace(/ovoj$/,'ova');
  else if(/ckoj$/.test(w))w=w.replace(/ckoj$/,'cka');
  else if(/oj$/.test(w)&&w.length>4)w=w.replace(/oj$/,'a');
  if(p.length)p[p.length-1]=w;
  return p.join(' ');
}
function matchesNumberSpec(spec,n){
  if(n==null||!spec)return false;
  return String(spec).split(',').some(raw=>{
    const t=raw.trim(); const nums=(t.match(/\d+/g)||[]).map(Number);
    if(!nums.length)return false;
    if(t.includes('-')&&nums.length>=2){
      const a=nums[0],b=nums[1],lo=Math.min(a,b),hi=Math.max(a,b);
      if(n<lo||n>hi)return false;
      if(a>0&&b>0&&a%2===b%2&&Math.abs(a-b)>=2)return n%2===a%2;
      return true;
    }
    return n===nums[0];
  });
}
function matchEvent(address,ev){
  if(address.municipality&&norm(address.municipality)!==norm(ev.municipality))return null;
  if(normStreet(address.street)!==normStreet(ev.street))return null;
  const monitored=ev.utility==='electricity'?address.electricity:address.water;
  if(!monitored)return null;
  const n=houseNum(address.number);
  if(ev.scope==='all')return {confidence:'certain'};
  if(ev.scope==='numbers')return matchesNumberSpec(ev.numberSpec,n)?{confidence:'certain'}:null;
  return {confidence:'possible'};
}
function belgradeNowKey(){
  const parts=new Intl.DateTimeFormat('en-CA',{
    timeZone:'Europe/Belgrade',
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',hourCycle:'h23'
  }).formatToParts(new Date());
  const get=t=>parts.find(p=>p.type===t)?.value||'';
  return `${get('year')}-${get('month')}-${get('day')}T${get('hour')}:${get('minute')}`;
}
function addDaysISO(iso,days){
  const [y,m,d]=(iso||'').split('-').map(Number);
  if(!y||!m||!d)return iso;
  const dt=new Date(Date.UTC(y,m-1,d+days));
  return dt.toISOString().slice(0,10);
}
function eventIsCurrentOrFuture(ev){
  if(!ev?.date||!ev?.end)return true;
  const endDate=(ev.start&&ev.end<=ev.start)?addDaysISO(ev.date,1):ev.date;
  const endKey=`${endDate}T${ev.end}`;
  return endKey>=belgradeNowKey();
}
function matches(){
  const out=[];
  state.addresses.forEach(a=>state.events.forEach(ev=>{
    if(!eventIsCurrentOrFuture(ev))return;
    const m=matchEvent(a,ev);
    if(m)out.push({address:a,event:ev,...m});
  }));
  return out.sort((a,b)=>`${a.event.date}${a.event.start}`.localeCompare(`${b.event.date}${b.event.start}`));
}
function fmtDate(iso){const d=new Date(iso+'T12:00:00'); return new Intl.DateTimeFormat('sr-RS',{day:'numeric',month:'long'}).format(d)}
function duration(start,end){ const [sh,sm]=start.split(':').map(Number), [eh,em]=end.split(':').map(Number); let mins=(eh*60+em)-(sh*60+sm); if(mins<0) mins+=1440; const h=Math.floor(mins/60), m=mins%60; return `${h} h${m?` ${m} min`:''}`; }

}
function render(){
  document.getElementById('app').innerHTML = !state.authChecked ? loadingScreen() : (state.user ? layout() : authScreen());
  bind();
}
function bind(){
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;state.profileOpen=false;state.mobileMenuOpen=false;render();if(state.tab==='announcements')loadHistory()});
  document.querySelectorAll('[data-auth-mode]').forEach(el=>el.onclick=()=>{
    const next=el.dataset.authMode;
    if(next==='login'&&state.resetToken){
      state.resetToken='';
      history.replaceState({},'',location.pathname);
    }
    state.authMode=next;
    state.authError='';
    state.authMessage='';
    render();
  });
  const authForm=document.getElementById('authForm');
  if(authForm)authForm.onsubmit=async e=>{
    e.preventDefault(); state.authError='';
    const fd=new FormData(authForm); const email=String(fd.get('email')||''); const password=String(fd.get('password')||'');
    try{
      const res=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:state.authMode,email,password})});
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||'Prijava nije uspela.');
      const justRegistered=state.authMode==='register';
      state.user=data.user; state.authChecked=true;
      state.installOnboarding=justRegistered && isMobileDevice() && !isStandalone();
      await loadUserData(); await loadOutages(); await checkPushStatus(); render();
    }catch(err){state.authError=err.message||String(err);render()}
  };

  const forgotForm=document.getElementById('forgotPasswordForm');
  if(forgotForm)forgotForm.onsubmit=async e=>{
    e.preventDefault();
    state.authError='';
    state.authMessage='';
    const fd=new FormData(forgotForm);
    const email=String(fd.get('email')||'').trim();
    try{
      const res=await fetch('/api/auth',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'request-reset',email})
      });
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||'Reset link nije poslat.');
      state.authMessage=data.message||'Ako nalog postoji, poslali smo reset link.';
      render();
    }catch(err){
      state.authError=err.message||String(err);
      render();
    }
  };

  const resetForm=document.getElementById('resetPasswordForm');
  if(resetForm)resetForm.onsubmit=async e=>{
    e.preventDefault();
    state.authError='';
    state.authMessage='';
    const fd=new FormData(resetForm);
    const password=String(fd.get('password')||'');
    const confirmPassword=String(fd.get('confirmPassword')||'');
    if(password!==confirmPassword){
      state.authError='Lozinke se ne poklapaju.';
      render();
      return;
    }
    try{
      const res=await fetch('/api/auth',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'reset-password',token:state.resetToken,password})
      });
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||'Promena lozinke nije uspela.');
      state.user=data.user;
      state.resetToken='';
      state.authMode='login';
      state.authChecked=true;
      history.replaceState({},'',location.pathname);
      await loadUserData();
      await loadOutages();
      await checkPushStatus();
      render();
      toast('Lozinka je uspešno promenjena.');
    }catch(err){
      state.authError=err.message||String(err);
      render();
    }
  };

  document.querySelectorAll('[data-action="add-address"]').forEach(el=>el.onclick=()=>{ if(state.addresses.length>=CONFIG.maxAddresses) return toast('Maksimalno 3 adrese u V1.'); state.modal='address'; state.editId=null; render(); });
  document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{ state.modal='address'; state.editId=el.dataset.edit; render(); });
  document.querySelectorAll('[data-action="close-modal"]').forEach(el=>el.onclick=()=>{ state.modal=null; state.editId=null; render(); });
  const backdrop=document.getElementById('modalBackdrop'); if(backdrop) backdrop.onclick=(e)=>{ if(e.target===backdrop){ state.modal=null; state.editId=null; render(); } };
  document.querySelectorAll('[data-pref-check]').forEach(el=>el.onchange=()=>{ const k=el.dataset.prefCheck; state.prefs[k]=el.checked; save('najava_prefs',state.prefs); syncUserData(); render(); });
  document.querySelectorAll('[data-action="refresh"]').forEach(el=>el.onclick=()=>{toast('Osvežavam izvore…');loadOutages();});
  document.querySelectorAll('[data-action="toggle-details"]').forEach(el=>el.onclick=e=>{if(e.target.closest('a'))return;const id=el.dataset.eventId;state.expandedEventId=state.expandedEventId===id?null:id;render()});
  const profile=document.querySelector('[data-action="profile-menu"]'); if(profile)profile.onclick=()=>{state.profileOpen=!state.profileOpen;render()};
  document.querySelectorAll('[data-action="mobile-menu"]').forEach(el=>el.onclick=()=>{state.mobileMenuOpen=true;render()});
  document.querySelectorAll('[data-action="close-mobile-menu"]').forEach(el=>el.onclick=()=>{state.mobileMenuOpen=false;render()});
  const logout=document.querySelector('[data-action="logout"]'); if(logout)logout.onclick=logoutUser;
  const enablePushBtn=document.querySelector('[data-action="enable-push"]'); if(enablePushBtn)enablePushBtn.onclick=enablePush;
  const testPushBtn=document.querySelector('[data-action="test-push"]'); if(testPushBtn)testPushBtn.onclick=testPush;
  const refreshHistory=document.querySelector('[data-action="refresh-history"]'); if(refreshHistory)refreshHistory.onclick=loadHistory;
  document.querySelectorAll('[data-action="install-app"]').forEach(el=>el.onclick=installApp);
  document.querySelectorAll('[data-action="dismiss-install-onboarding"]').forEach(el=>el.onclick=()=>{state.installOnboarding=false;render()});
  document.querySelectorAll('[data-action="show-install-guide"]').forEach(el=>el.onclick=()=>{state.installOnboarding=true;render()});
  const del=document.querySelector('[data-action="delete-address"]'); if(del) del.onclick=()=>{ state.addresses=state.addresses.filter(x=>x.id!==state.editId); save('najava_addresses',state.addresses); syncUserData(); state.modal=null; state.editId=null; toast('Adresa je obrisana.'); render(); };
  const form=document.getElementById('addressForm');
  if(form) form.onsubmit=(e)=>{ e.preventDefault(); const fd=new FormData(form); const data={ id: state.editId || crypto.randomUUID(), label:String(fd.get('label')).trim(), street:String(fd.get('street')).trim(), number:String(fd.get('number')).trim(), municipality:String(fd.get('municipality')), electricity: fd.get('electricity')==='on', water: fd.get('water')==='on' }; if(!data.electricity && !data.water) return toast('Izaberi bar jednu uslugu.'); if(state.editId) state.addresses=state.addresses.map(x=>x.id===data.id?data:x); else state.addresses.push(data); save('najava_addresses',state.addresses); syncUserData(); state.modal=null; state.editId=null; toast('Adresa je sačuvana.'); render(); };
}
async function checkAuth(){
  try{
    const res=await fetch('/api/auth',{credentials:'same-origin'});
    if(res.ok){const data=await res.json();state.user=data.user}else state.user=null;
  }catch{state.user=null}
  state.authChecked=true;
}
async function logoutUser(){
  await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})}).catch(()=>{});
  state.user=null;state.profileOpen=false;state.expandedEventId=null;render();
}
async function loadUserData(){
  if(!state.user)return;
  try{
    const res=await fetch('/api/user-data');
    if(!res.ok)return;
    const data=await res.json();
    const remoteHas=Array.isArray(data.addresses)&&data.addresses.length;
    if(remoteHas){
      state.addresses=data.addresses;state.prefs={...state.prefs,...(data.prefs||{})};
      save('najava_addresses',state.addresses);save('najava_prefs',state.prefs);
    }else if(state.addresses.length){await syncUserData()}
  }catch{}
}
async function syncUserData(){
  if(!state.user)return;
  fetch('/api/user-data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({addresses:state.addresses,prefs:state.prefs})}).catch(()=>{});
}
function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function registerSW(){
  if(!('serviceWorker'in navigator))return null;
  try{
    const reg=await navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'});
    try{await reg.update()}catch{}
    return reg;
  }catch(err){
    state.pushDiagnostic='Service worker greška: '+(err?.message||String(err));
    return null;
  }
}
async function checkPushStatus(){
  state.pushDiagnosticType='neutral';
  if(!window.isSecureContext){state.pushEnabled=false;state.pushDiagnostic='Push zahteva HTTPS.';state.pushDiagnosticType='error';return}
  if(!('Notification'in window)){state.pushEnabled=false;state.pushDiagnostic='Ovaj browser nema Notifications API.';state.pushDiagnosticType='error';return}
  if(!('serviceWorker'in navigator)||!('PushManager'in window)){state.pushEnabled=false;state.pushDiagnostic='Ovaj browser ne podržava Web Push.';state.pushDiagnosticType='error';return}
  try{
    const reg=await registerSW();
    if(!reg){state.pushEnabled=false;state.pushDiagnosticType='error';return}
    const sub=await reg.pushManager.getSubscription();
    state.pushEnabled=Boolean(sub);
    if(Notification.permission==='denied'){
      state.pushDiagnostic='Notifikacije su blokirane za ovaj sajt. U Chrome podešavanjima dozvoli Notifications.';
      state.pushDiagnosticType='error';
    }else if(state.pushEnabled){
      state.pushDiagnostic='Uređaj je registrovan za push.';
      state.pushDiagnosticType='ok';
    }else{
      state.pushDiagnostic='Push još nije uključen na ovom uređaju.';
      state.pushDiagnosticType='neutral';
    }
  }catch(err){
    state.pushEnabled=false;
    state.pushDiagnostic='Provera push-a nije uspela: '+(err?.message||String(err));
    state.pushDiagnosticType='error';
  }
}
async function ensurePushSubscription(forceReset=false){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone=window.matchMedia?.('(display-mode: standalone)').matches || window.navigator.standalone===true;
  if(ios&&!standalone)throw new Error('Na iPhone-u prvo dodaj Najavi na Home Screen i otvori je sa ikonice.');
  if(!window.isSecureContext)throw new Error('Push zahteva HTTPS.');
  if(!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window))throw new Error('Ovaj browser ne podržava Web Push.');

  let permission=Notification.permission;
  if(permission==='default')permission=await Notification.requestPermission();
  if(permission!=='granted')throw new Error(permission==='denied'
    ? 'Notifikacije su blokirane. Otvori Chrome → Settings → Site settings → Notifications i dozvoli ih za ovaj sajt.'
    : 'Dozvola za notifikacije nije odobrena.');

  state.pushDiagnostic='Registrujem ovaj uređaj…';
  state.pushDiagnosticType='working';
  render();

  const reg=await registerSW();
  if(!reg)throw new Error(state.pushDiagnostic||'Service worker nije registrovan.');

  let sub=await reg.pushManager.getSubscription();
  if(forceReset&&sub){
    try{await sub.unsubscribe()}catch{}
    sub=null;
  }
  if(!sub){
    sub=await reg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
  }

  const res=await fetch('/api/push-subscribe',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials:'same-origin',
    body:JSON.stringify({subscription:sub.toJSON()})
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||'Server nije sačuvao push pretplatu.');

  state.pushEnabled=true;
  return {reg,sub};
}
async function runLocalNotificationTest(reg){
  state.pushDiagnostic='1/2 Proveravam da li telefon može da prikaže notifikaciju…';
  state.pushDiagnosticType='working';
  render();
  try{
    await reg.showNotification('Najavi — test telefona',{
      body:'Ako vidiš ovu poruku, dozvola i prikaz notifikacija na telefonu rade.',
      icon:'/najava-icon.svg',
      badge:'/najava-icon.svg',
      tag:'najavi-local-test-'+Date.now(),
      data:{url:'/'}
    });
    return true;
  }catch(err){
    throw new Error('Telefon/browser nije prikazao lokalnu notifikaciju: '+(err?.message||String(err)));
  }
}
async function sendPushTest(){
  state.pushDiagnostic='2/2 Šaljem pravi push sa servera…';
  state.pushDiagnosticType='working';
  render();

  const res=await fetch('/api/push-test',{method:'POST',credentials:'same-origin'});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||data.details||'Server push test nije uspeo.');
  if(!data.sent)throw new Error('Server nije isporučio nijednu push poruku.');

  state.pushEnabled=true;
  state.pushDiagnostic='Sve radi: telefon prihvata notifikacije i server je uspešno poslao push.';
  state.pushDiagnosticType='ok';
  toast('Push test uspešan.');
  setTimeout(loadHistory,500);
  render();
}
async function enablePush(){
  try{
    const {reg}=await ensurePushSubscription(true);
    await runLocalNotificationTest(reg);
    await sendPushTest();
  }catch(err){
    state.pushDiagnostic=err?.message||String(err);
    state.pushDiagnosticType='error';
    render();
  }
}
async function testPush(){
  try{
    const {reg}=await ensurePushSubscription(false);
    await runLocalNotificationTest(reg);
    await sendPushTest();
  }catch(err){
    state.pushDiagnostic=err?.message||String(err);
    state.pushDiagnosticType='error';
    render();
  }
}
async function installApp(){
  if(!deferredInstallPrompt){toast('Browser trenutno ne nudi direktnu instalaciju. Koristi meni browsera.');return}
  deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;state.installPromptReady=false;render();
}
async function loadHistory(){
  if(!state.user)return;
  state.historyLoading=true;if(state.tab==='announcements')render();
  try{
    const res=await fetch('/api/notification-history');
    if(res.ok){const data=await res.json();state.history=Array.isArray(data.items)?data.items:[]}
  }catch{}finally{state.historyLoading=false;if(state.tab==='announcements')render()}
}
async function loadOutages(){
  state.loading=true; render();
  try{
    const res=await fetch('/api/outages',{headers:{Accept:'application/json'}});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    state.events=Array.isArray(data.events)?data.events:[];
    state.sources=data.sources||{};
    state.lastChecked=new Intl.DateTimeFormat('sr-Latn-RS',{hour:'2-digit',minute:'2-digit'}).format(new Date(data.generatedAt||Date.now()));
  }catch(e){
    state.events=[];
    state.sources={};
    state.lastChecked='greška';
  }finally{
    state.loading=false; render();
  }
}
function toast(msg){ const old=document.querySelector('.toast'); if(old) old.remove(); const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2200); }
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s=''){return escapeHtml(s)}
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;state.installPromptReady=true;if(state.authChecked)render()});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;state.installPromptReady=false;if(state.authChecked)render()});
async function init(){
  const resetToken=new URLSearchParams(location.search).get('reset');
  if(resetToken){
    state.resetToken=resetToken;
    state.authMode='reset';
    state.user=null;
    state.authChecked=true;
    render();
    await registerSW();
    return;
  }
  render();
  await registerSW();
  await checkAuth();
  if(state.user){await loadUserData();await checkPushStatus();await Promise.all([loadOutages(),loadHistory()])}
  render();
}
init();

</script>
